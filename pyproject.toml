[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalens-sdk"
version = "0.7.0"
description = "Python SDK for the DataLens API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "DataLens Team", email = "datalens-opensource@yandex-team.ru" }]
keywords = ["analytics", "business-intelligence", "datalens", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "typing_extensions>=4.12",
]

[dependency-groups]
dev = [
  "build",
  "check-wheel-contents",
  "mypy==2.3.0",
  "nox",
  "packaging",
  "pytest",
  "ruff==0.16.0",
  "tomli>=2",
  "twine",
]

[project.urls]
Homepage = "https://datalens.ru/"
Documentation = "https://github.com/datalens-tech/datalens-sdk#readme"
Repository = "https://github.com/datalens-tech/datalens-sdk"
Issues = "https://github.com/datalens-tech/datalens-sdk/issues"
Changelog = "https://github.com/datalens-tech/datalens-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"skills/datalens-sdk" = "datalens_sdk/skills/datalens-sdk"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/noxfile.py",
  "/pyproject.toml",
  "/scripts",
  "/skills",
  "/spec",
  "/src",
  "/tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/datalens_sdk/_generated"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "B",             # flake8-bugbear
  "UP",            # pyupgrade
  "RUF",           # ruff-specific
  "SIM",           # simplifications
  "C4",            # comprehensions
  "PIE",           # misc
  "PT",            # pytest-style
  "PLC0415",       # import outside top-level
]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.isort]
known-first-party = ["datalens_sdk"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
